<svg xmlns="http://www.w3.org/2000/svg" width="860" height="164" viewBox="0 0 860 164" role="img"><title>Ботяра говорит: В каждом чате должен быть тот, кто помнит всё. Привет, это я.</title><style><![CDATA[text{font-family:'gg sans', 'Noto Sans', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#e9e6ff}.channel{font-size:14px;font-weight:700}.name{font-size:16px;font-weight:700;fill:#3ee6c8}.tag{font-size:10px;font-weight:700;fill:#fff}.time{font-size:12.5px;fill:#8f89c0}.text{font-size:15.5px}.chip{font-size:13px;font-weight:700;fill:#e9e6ff}.emoji{font-family:'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif}.typing{opacity:0;animation:typing 1.9s both}@keyframes typing{0%,88%{opacity:1}100%{opacity:0}}.bounce{animation:bounce .9s ease-in-out infinite}@keyframes bounce{0%,60%,100%{transform:none}30%{transform:translateY(-4px)}}.message{animation:message .45s ease-out 1.8s both}@keyframes message{from{opacity:0;transform:translateY(4px)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}]]></style><rect x="0.5" y="0.5" width="859" height="163" rx="14" fill="#0e0b1d" stroke="#2c2360"/><text x="24" y="27" class="channel"><tspan fill="#8f89c0"># </tspan>задняя-парта</text><text x="836" y="27" text-anchor="end" class="time">27.09.2026</text><line x1="0.5" y1="44" x2="859.5" y2="44" stroke="#2c2360"/><clipPath id="avatar"><circle cx="46" cy="78" r="22"/></clipPath><image href="data:image/png;base64," x="24" y="56" width="44" height="44" clip-path="url(#avatar)"/><text x="84" y="74" class="name">Ботяра</text><rect x="156" y="61" width="30" height="16" rx="4" fill="#5865f2"/><text x="171" y="73" text-anchor="middle" class="tag">BOT</text><text x="196" y="73.5" class="time">Сегодня в 08:08</text><g class="typing"><circle cx="90" cy="99" r="3.2" fill="#8f89c0" class="bounce" style="animation-delay:0.00s"/><circle cx="100" cy="99" r="3.2" fill="#8f89c0" class="bounce" style="animation-delay:0.15s"/><circle cx="110" cy="99" r="3.2" fill="#8f89c0" class="bounce" style="animation-delay:0.30s"/><text x="124" y="104" class="time">Ботяра печатает…</text></g><g class="message"><text class="text"><tspan x="84" y="104">В каждом чате должен быть тот, кто помнит всё. Привет, это я.</tspan></text><rect x="84" y="118" width="58" height="26" rx="8" fill="#161230" stroke="#8b6cff"/><text x="94" y="136" class="chip"><tspan class="emoji">😂</tspan> 4</text></g></svg>
