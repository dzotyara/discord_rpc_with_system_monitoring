name: Refresh profile cards

on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "fonts/**"
      - "assets/botyara-avatar.png"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROFILE_USER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v6

      - name: Test the card generator
        run: python3 -m unittest discover -s tests

      - name: Draw neofetch, typing and Botyara cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build_profile.py --user "$PROFILE_USER"

      - name: Draw the contribution snake
        uses: Platane/snk/svg-only@v3
        continue-on-error: true # a snake hiccup should not hold back the other cards
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/snake-light.svg?color_snake=#7c5cff&color_dots=#ebedf0,#d9d0ff,#b3a1ff,#8a6dff,#5b3fd9
            assets/generated/snake-dark.svg?palette=github-dark&color_snake=#3ee6c8&color_dots=#161b22,#2e2a5c,#4b3aa8,#7053e8,#9d86ff

      - name: Commit the new cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/snapshot.json
          if git diff --cached --quiet; then
            echo "Cards are up to date."
            exit 0
          fi
          git commit -m "chore: redraw profile cards"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
